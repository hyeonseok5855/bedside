<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>bedside</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100dvh; display: flex; flex-direction: column;
        background: #121016; color: #ece9f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      }
      header {
        padding: 16px 20px 8px; display: flex; align-items: baseline; gap: 10px;
      }
      header h1 { font-size: 18px; margin: 0; font-weight: 600; }
      header .date { font-size: 13px; color: #9a95a6; }
      header .status { margin-left: auto; font-size: 12px; color: #b7a6f0; }
      #messages {
        flex: 1; overflow-y: auto; padding: 12px 16px 8px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .bubble {
        max-width: 76%; padding: 10px 14px; border-radius: 18px; line-height: 1.45;
        white-space: pre-wrap; word-break: break-word; font-size: 15px;
      }
      .assistant { align-self: flex-start; background: #2a2733; }
      .user { align-self: flex-end; background: #5b4b8a; }
      .typing { align-self: flex-start; color: #9a95a6; font-size: 14px; padding: 6px 14px; }
      form {
        display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid #26232e;
      }
      #input {
        flex: 1; resize: none; border: 1px solid #3a3644; background: #1b1922; color: #ece9f0;
        border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 15px; max-height: 140px;
      }
      #send {
        border: none; background: #7c6bd0; color: #fff; border-radius: 14px;
        padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
      }
      #send:disabled { opacity: 0.5; cursor: default; }
      details.ctx { padding: 0 16px 8px; }
      details.ctx summary { color: #9a95a6; font-size: 13px; cursor: pointer; }
      details.ctx textarea {
        width: 100%; margin-top: 8px; min-height: 90px; background: #1b1922; color: #ece9f0;
        border: 1px solid #3a3644; border-radius: 10px; padding: 10px; font: inherit; font-size: 13px;
      }
      details.ctx button {
        margin-top: 6px; background: #2a2733; color: #ece9f0; border: 1px solid #3a3644;
        border-radius: 10px; padding: 6px 12px; font: inherit; cursor: pointer;
      }
      #login {
        position: fixed; inset: 0; background: #121016; z-index: 10;
        display: none; align-items: center; justify-content: center;
      }
      #login .box { display: flex; flex-direction: column; gap: 10px; width: min(300px, 80vw); }
      #login h2 { margin: 0 0 4px; font-size: 20px; }
      #login input {
        background: #1b1922; color: #ece9f0; border: 1px solid #3a3644;
        border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 15px;
      }
      #login button {
        background: #7c6bd0; color: #fff; border: none; border-radius: 12px;
        padding: 12px; font: inherit; font-weight: 600; cursor: pointer;
      }
      #login .msg { color: #e08a8a; font-size: 13px; min-height: 16px; }
    </style>
  </head>
  <body>
    <div id="login">
      <form class="box" id="loginForm">
        <h2>bedside</h2>
        <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" />
        <button type="submit">로그인</button>
        <div class="msg" id="loginMsg"></div>
      </form>
    </div>

    <header>
      <h1>bedside</h1>
      <span class="date" id="date"></span>
      <span class="status" id="status">연결 중…</span>
    </header>

    <details class="ctx">
      <summary>컨텍스트 (동기화 전 임시로 붙여넣기 — 2단계에서 안드로이드가 자동 전송)</summary>
      <textarea id="context" placeholder="여기에 오늘 브리핑/프로필을 붙여넣고 저장하면 AI가 참고합니다."></textarea>
      <button id="saveCtx" type="button">컨텍스트 저장</button>
    </details>

    <div id="messages"></div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="답을 적어요" autocomplete="off"></textarea>
      <button id="send" type="submit" disabled>보내기</button>
    </form>

    <script type="module" src="./app.js"></script>
  </body>
</html>
